apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: quilore
spec:
  selector:
    app: ai-service
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: quilore
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      # imagePullSecrets:
      #   - name: quilore-ghcr
      containers:
        - name: ai-service
          image: ghcr.io/subh2312/quilore-ai-service:staging
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: ENVIRONMENT
              value: staging
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: quilore-secrets
                  key: DATABASE_URL
            - name: AI_SERVICE_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: quilore-secrets
                  key: AI_SERVICE_INTERNAL_TOKEN
            - name: NVIDIA_NIM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: quilore-secrets
                  key: NVIDIA_NIM_API_KEY
                  optional: true
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: quilore-secrets
                  key: GROQ_API_KEY
                  optional: true
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: quilore-secrets
                  key: OPENROUTER_API_KEY
                  optional: true
            - name: HF_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: quilore-secrets
                  key: HF_API_TOKEN
                  optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
