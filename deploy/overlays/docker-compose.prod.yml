# Production overlay — pulls production-channel images from GHCR.
# Usage:
#   export BACKEND_IMAGE=ghcr.io/<owner>/quilore-backend:production
#   export AI_SERVICE_IMAGE=ghcr.io/<owner>/quilore-ai-service:production
#   docker compose -f docker-compose.yml -f deploy/overlays/docker-compose.prod.yml up -d --no-build

services:
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/subh2312/quilore-backend:production}
    environment:
      SPRING_PROFILES_ACTIVE: prod
    restart: always

  ai-service:
    image: ${AI_SERVICE_IMAGE:-ghcr.io/subh2312/quilore-ai-service:production}
    environment:
      ENVIRONMENT: production
    restart: always

  postgres:
    restart: always

  minio:
    restart: always
