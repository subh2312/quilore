# TLS termination overlay — OPTIONAL non-tunnel path (Story 15.2).
# The primary VPS deployment uses Cloudflare Tunnel + loopback
# (see docker-compose.tunnel.yml). Use this overlay only when you
# intentionally terminate TLS on-host with Caddy (requires public 80/443).
#
# Usage (from repo root):
#   QUILORE_DOMAIN=app.example.com docker compose \
#     -f docker-compose.yml \
#     -f deploy/overlays/docker-compose.tls.yml \
#     up -d

services:
  caddy:
    image: caddy:2.9-alpine
    container_name: quilore-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      QUILORE_DOMAIN: ${QUILORE_DOMAIN:-localhost}
    volumes:
      - ./deploy/overlays/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - ai-service

volumes:
  caddy_data:
  caddy_config:
