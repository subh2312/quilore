spring:
  application:
    name: quilore-backend

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:quilore}
    username: ${POSTGRES_USER:quilore}
    password: ${POSTGRES_PASSWORD:quilore_dev_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - prometheus
          - metrics
  endpoint:
    health:
      show-details: when_authorized
    prometheus:
      enabled: true
    metrics:
      enabled: true
  metrics:
    tags:
      application: quilore-backend
  observations:
    key-values:
      service: quilore-backend
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    root: INFO
    com.quilore: INFO

quilore:
  security:
    data-encryption-key: ${DATA_ENCRYPTION_KEY:}
    jwt-secret: ${JWT_SECRET:}
