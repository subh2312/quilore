spring:
  application:
    name: quilore-backend

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:quilore}
    username: ${POSTGRES_USER:quilore}
    password: ${POSTGRES_PASSWORD:quilore_dev_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - prometheus
          - metrics
  endpoint:
    health:
      show-details: when_authorized
    prometheus:
      enabled: true
    metrics:
      enabled: true
  metrics:
    tags:
      application: quilore-backend
  observations:
    key-values:
      service: quilore-backend
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    root: INFO
    com.quilore: INFO

quilore:
  security:
    data-encryption-key: ${DATA_ENCRYPTION_KEY:}
    jwt-secret: ${JWT_SECRET:}
    jwt-issuer: ${JWT_ISSUER:quilore}
    jwt-audience: ${JWT_AUDIENCE:quilore-api}
    # Staging/prod MUST leave this false. Dev/test may set true only with explicit profile.
    allow-insecure-defaults: ${QUILORE_ALLOW_INSECURE_DEFAULTS:false}
  ai:
    service-url: ${AI_SERVICE_URL:http://localhost:8000}
    connect-timeout-ms: 3000
    read-timeout-ms: 30000
  billing:
    # Staging/prod MUST leave false — mock receipts bypass store verification for UAT only.
    allow-mock-receipts: ${QUILORE_ALLOW_MOCK_RECEIPTS:false}
    mock-receipt-token: ${QUILORE_MOCK_RECEIPT_TOKEN:UAT_MOCK_RECEIPT}
    apple-shared-secret: ${APPLE_SHARED_SECRET:}
    google-play-package-name: ${GOOGLE_PLAY_PACKAGE_NAME:}

minio:
  enabled: ${MINIO_ENABLED:false}
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  bucket: ${MINIO_BUCKET:quilore-media}
  access-key: ${MINIO_ROOT_USER:quilore_minio}
  secret-key: ${MINIO_ROOT_PASSWORD:}
