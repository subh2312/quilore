services:
  # ─── PostgreSQL 16 with pgvector ───────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: quilore-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quilore}
      POSTGRES_USER: ${POSTGRES_USER:-quilore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quilore_dev_pass}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quilore} -d ${POSTGRES_DB:-quilore}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── MinIO (S3-compatible object storage) ──────────────────
  minio:
    image: minio/minio:latest
    container_name: quilore-minio
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"   # API (loopback — Cloudflare Tunnel / SSH only)
      - "127.0.0.1:9001:9001"   # Console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-quilore_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-quilore_minio_secret}
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ─── Spring Boot Backend ───────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quilore-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SERVER_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-quilore}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-quilore}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-quilore_dev_pass}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-quilore_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-quilore_minio_secret}
    depends_on:
      postgres:
        condition: service_healthy

  # ─── FastAPI AI Service ────────────────────────────────────
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: quilore-ai-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:${AI_SERVICE_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-quilore}:${POSTGRES_PASSWORD:-quilore_dev_pass}@postgres:5432/${POSTGRES_DB:-quilore}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      HF_API_TOKEN: ${HF_API_TOKEN:-}
      NVIDIA_NIM_API_KEY: ${NVIDIA_NIM_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
