name: Promote — Staging to Production

# Promotes already-published staging/release images into the production channel.
# Does not rebuild from source — retags immutable digests so production always
# tracks a previously tested artifact (Story 16.4 environment promotion).

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version to promote (e.g. staging-a1b2c3d or v1.2.3)'
        required: true
        type: string
      confirm:
        description: 'Type promote-to-production to confirm'
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: promote-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  promote:
    name: Promote to Production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Confirm promotion intent
        run: |
          if [ "${{ inputs.confirm }}" != "promote-to-production" ]; then
            echo "Refusing promotion: confirmation string mismatch."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Derive image names
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if ! echo "$INPUT_VERSION" | grep -Eq '^(staging-[a-f0-9]+|v[0-9]+\.[0-9]+\.[0-9]+)$'; then
            echo "Refusing promotion: version must match staging-<sha> or vMAJOR.MINOR.PATCH"
            exit 1
          fi
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          {
            echo "owner=${OWNER}"
            echo "backend=${{ env.REGISTRY }}/${OWNER}/quilore-backend"
            echo "ai=${{ env.REGISTRY }}/${OWNER}/quilore-ai-service"
            echo "version=${INPUT_VERSION}"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install crane
        uses: imjasonh/setup-crane@v0.4

      - name: Retag backend image for production
        run: |
          SRC="${{ steps.meta.outputs.backend }}:${{ steps.meta.outputs.version }}"
          crane copy "$SRC" "${{ steps.meta.outputs.backend }}:production"
          crane copy "$SRC" "${{ steps.meta.outputs.backend }}:prod-${{ steps.meta.outputs.version }}"

      - name: Retag ai-service image for production
        run: |
          SRC="${{ steps.meta.outputs.ai }}:${{ steps.meta.outputs.version }}"
          crane copy "$SRC" "${{ steps.meta.outputs.ai }}:production"
          crane copy "$SRC" "${{ steps.meta.outputs.ai }}:prod-${{ steps.meta.outputs.version }}"

      - name: Write production pin
        run: |
          mkdir -p dist
          cat > dist/versions.production.env <<EOF
          QUILORE_IMAGE_CHANNEL=production
          QUILORE_IMAGE_VERSION=${{ steps.meta.outputs.version }}
          BACKEND_IMAGE=${{ steps.meta.outputs.backend }}:prod-${{ steps.meta.outputs.version }}
          AI_SERVICE_IMAGE=${{ steps.meta.outputs.ai }}:prod-${{ steps.meta.outputs.version }}
          PROMOTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          PROMOTED_BY=${{ github.actor }}
          EOF
          cat dist/versions.production.env

      - name: Upload production pin artifact
        uses: actions/upload-artifact@v4
        with:
          name: quilore-production-${{ steps.meta.outputs.version }}
          path: dist/versions.production.env
          retention-days: 90

      - name: Optional remote deploy (when DEPLOY_HOST is configured)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          if [ -z "${DEPLOY_HOST:-}" ]; then
            echo "DEPLOY_HOST not set — skipping remote apply. Images are promoted in the registry."
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh -o StrictHostKeyChecking=accept-new \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cd '${DEPLOY_PATH}' && \
             BACKEND_IMAGE='${{ steps.meta.outputs.backend }}:prod-${{ steps.meta.outputs.version }}' \
             AI_SERVICE_IMAGE='${{ steps.meta.outputs.ai }}:prod-${{ steps.meta.outputs.version }}' \
             bash deploy/scripts/apply-env.sh production"
