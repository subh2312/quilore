name: Publish — Versioned Container Images

# Publishes **linux/arm64 only** images to GHCR after merges to `dev` (and on tags).
# Builds/publishes only services whose paths changed. Then deploys those services to the Pi.
# Client/mobile changes do not publish or deploy server images (reserved for a later mobile pipeline).

on:
  push:
    branches: [dev]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (branch, tag, or SHA)'
        required: false
        default: ''
      force_backend:
        description: 'Force backend publish+deploy'
        type: boolean
        default: false
      force_ai:
        description: 'Force ai-service publish+deploy'
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.set.outputs.backend }}
      ai: ${{ steps.set.outputs.ai }}
      deploy_config: ${{ steps.set.outputs.deploy_config }}
      client: ${{ steps.set.outputs.client }}
      any_server: ${{ steps.set.outputs.any_server }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}

      - name: Path filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
            ai:
              - 'ai-service/**'
            deploy_config:
              - 'deploy/**'
              - 'docker-compose.yml'
              - '.env.example'
            client:
              - 'client/**'

      - name: Resolve publish flags
        id: set
        run: |
          set -euo pipefail
          BACKEND='${{ steps.filter.outputs.backend }}'
          AI='${{ steps.filter.outputs.ai }}'
          DEPLOY='${{ steps.filter.outputs.deploy_config }}'
          CLIENT='${{ steps.filter.outputs.client }}'

          # Tags → publish both server images
          if [[ '${{ github.ref }}' == refs/tags/v* ]]; then
            BACKEND=true
            AI=true
          fi
          if [[ '${{ inputs.force_backend }}' == 'true' ]]; then BACKEND=true; fi
          if [[ '${{ inputs.force_ai }}' == 'true' ]]; then AI=true; fi

          # Manual dispatch with no path signal → publish both
          if [[ '${{ github.event_name }}' == 'workflow_dispatch' \
                && '${{ inputs.force_backend }}' != 'true' \
                && '${{ inputs.force_ai }}' != 'true' \
                && "${BACKEND}" != 'true' && "${AI}" != 'true' ]]; then
            BACKEND=true
            AI=true
          fi

          ANY=false
          if [[ "$BACKEND" == 'true' || "$AI" == 'true' || "$DEPLOY" == 'true' ]]; then
            ANY=true
          fi

          {
            echo "backend=${BACKEND}"
            echo "ai=${AI}"
            echo "deploy_config=${DEPLOY}"
            echo "client=${CLIENT}"
            echo "any_server=${ANY}"
          } >> "$GITHUB_OUTPUT"

          echo "backend=$BACKEND ai=$AI deploy_config=$DEPLOY client=$CLIENT any_server=$ANY"

  meta:
    name: Image metadata
    needs: changes
    if: needs.changes.outputs.any_server == 'true' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.ai == 'true'
    runs-on: ubuntu-latest
    outputs:
      owner: ${{ steps.meta.outputs.owner }}
      sha_short: ${{ steps.meta.outputs.sha_short }}
      full_sha: ${{ steps.meta.outputs.full_sha }}
      channel: ${{ steps.meta.outputs.channel }}
      version: ${{ steps.meta.outputs.version }}
      backend_image: ${{ steps.meta.outputs.backend_image }}
      ai_image: ${{ steps.meta.outputs.ai_image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Derive image metadata
        id: meta
        run: |
          set -euo pipefail
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          SHA_SHORT="$(git rev-parse --short HEAD)"
          FULL_SHA="$(git rev-parse HEAD)"
          CHANNEL="staging"
          VERSION="staging-${SHA_SHORT}"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            CHANNEL="release"
            VERSION="${GITHUB_REF_NAME}"
          fi
          {
            echo "owner=${OWNER}"
            echo "sha_short=${SHA_SHORT}"
            echo "full_sha=${FULL_SHA}"
            echo "channel=${CHANNEL}"
            echo "version=${VERSION}"
            echo "backend_image=${{ env.REGISTRY }}/${OWNER}/quilore-backend"
            echo "ai_image=${{ env.REGISTRY }}/${OWNER}/quilore-ai-service"
          } >> "$GITHUB_OUTPUT"

  publish-backend:
    name: Publish backend (arm64)
    needs: [changes, meta]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Backend test gate
        working-directory: backend
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU (arm64)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Publish backend image (linux/arm64 only)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ needs.meta.outputs.backend_image }}:${{ needs.meta.outputs.version }}
            ${{ needs.meta.outputs.backend_image }}:sha-${{ needs.meta.outputs.sha_short }}
            ${{ needs.meta.outputs.backend_image }}:${{ needs.meta.outputs.channel }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.meta.outputs.full_sha }}
            org.opencontainers.image.version=${{ needs.meta.outputs.version }}
          cache-from: type=gha,scope=backend-arm64
          cache-to: type=gha,mode=max,scope=backend-arm64

  publish-ai:
    name: Publish ai-service (arm64)
    needs: [changes, meta]
    if: needs.changes.outputs.ai == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: AI service test gate
        working-directory: ai-service
        run: |
          pip install -r requirements.txt
          pip install pytest httpx
          pytest tests/ -v

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU (arm64)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Publish ai-service image (linux/arm64 only)
        uses: docker/build-push-action@v6
        with:
          context: ./ai-service
          file: ./ai-service/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ needs.meta.outputs.ai_image }}:${{ needs.meta.outputs.version }}
            ${{ needs.meta.outputs.ai_image }}:sha-${{ needs.meta.outputs.sha_short }}
            ${{ needs.meta.outputs.ai_image }}:${{ needs.meta.outputs.channel }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.meta.outputs.full_sha }}
            org.opencontainers.image.version=${{ needs.meta.outputs.version }}
          cache-from: type=gha,scope=ai-service-arm64
          cache-to: type=gha,mode=max,scope=ai-service-arm64

  deploy-pi:
    name: Deploy changed services to Pi
    needs: [changes, meta, publish-backend, publish-ai]
    # Run when server-side work happened; allow skipped publish jobs (unchanged service).
    if: |
      always()
      && needs.changes.outputs.any_server == 'true'
      && (needs.changes.outputs.backend != 'true' || needs.publish-backend.result == 'success')
      && (needs.changes.outputs.ai != 'true' || needs.publish-ai.result == 'success')
      && (needs.meta.result == 'success' || needs.meta.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Require deploy secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          missing=0
          for v in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_PATH; do
            if [ -z "${!v}" ]; then
              echo "Missing secret: $v"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Pi deploy secrets not configured. Set DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_PATH on the repo."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      # cloudflared is installed on the *GitHub-hosted runner* only, so Actions can
      # SSH through the Cloudflare Tunnel to the Pi (ProxyCommand).
      # The Pi already runs cloudflared as the tunnel connector — we never install/restart it there.
      - name: Install cloudflared on Actions runner (not on Pi)
        env:
          CLOUDFLARED_VERSION: "2026.7.3"
          CLOUDFLARED_SHA256: "9d71c677db00134c1bd4144b7783486b654ad281b1ea62b4972098d19f770f17"
        run: |
          set -euo pipefail
          if command -v cloudflared >/dev/null 2>&1; then
            cloudflared version
            exit 0
          fi
          url="https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64"
          for attempt in 1 2 3 4 5; do
            if curl -fsSL --retry 3 --retry-all-errors --connect-timeout 20 \
                 -o /tmp/cloudflared "$url"; then
              break
            fi
            echo "download attempt ${attempt} failed; retrying..."
            sleep $((attempt * 3))
            if [[ "$attempt" -eq 5 ]]; then
              echo "::error::Failed to download cloudflared ${CLOUDFLARED_VERSION} for the Actions runner"
              exit 1
            fi
          done
          echo "${CLOUDFLARED_SHA256}  /tmp/cloudflared" | sha256sum -c -
          chmod +x /tmp/cloudflared
          sudo mv /tmp/cloudflared /usr/local/bin/cloudflared
          cloudflared version

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          KEY_FILE="$HOME/.ssh/id_ed25519"
          # Write private key; tolerate accidental literal \n from secret UI paste.
          if [[ "$DEPLOY_SSH_KEY" == *$'\n'* ]]; then
            printf '%s\n' "$DEPLOY_SSH_KEY" > "$KEY_FILE"
          else
            printf '%b\n' "$DEPLOY_SSH_KEY" > "$KEY_FILE"
          fi
          chmod 600 "$KEY_FILE"

          if ! ssh-keygen -y -f "$KEY_FILE" >/tmp/deploy_pubkey 2>/tmp/keyerr; then
            echo "::error::DEPLOY_SSH_KEY is not a valid OpenSSH private key."
            echo "Re-set it from the quilore-agent private file (include BEGIN/END lines):"
            echo "  gh secret set DEPLOY_SSH_KEY < /path/to/quilore-agent"
            cat /tmp/keyerr >&2 || true
            exit 1
          fi
          echo "Deploy key fingerprint: $(ssh-keygen -lf "$KEY_FILE" | awk '{print $2}')"

          # Avoid YAML-indent pollution in ssh_config by writing via printf.
          {
            echo "Host quilore-pi"
            echo "  HostName ${DEPLOY_HOST}"
            echo "  User ${DEPLOY_USER}"
            echo "  IdentityFile ${KEY_FILE}"
            echo "  IdentitiesOnly yes"
            echo "  BatchMode yes"
            echo "  StrictHostKeyChecking accept-new"
            echo "  ProxyCommand cloudflared access ssh --hostname %h"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config
          echo "SSH config:" && cat ~/.ssh/config

          echo "Testing SSH to Pi..."
          if ! ssh quilore-pi 'echo SSH_OK; whoami; hostname'; then
            echo "::error::SSH to Pi failed (Permission denied / key mismatch)."
            echo "Ensure DEPLOY_SSH_KEY matches a line in ~${DEPLOY_USER}/.ssh/authorized_keys on the Pi."
            echo "Working key fingerprint on Pi should be SHA256:QhSIfj1dYPGhbCaRjjN2i9HTXXsRjsLcMGQST9fFyD0 (cursor-cloud-agent)."
            exit 1
          fi

      - name: Resolve deploy flags & image pins
        id: pins
        run: |
          set -euo pipefail
          BACKEND_CHANGED='${{ needs.changes.outputs.backend }}'
          AI_CHANGED='${{ needs.changes.outputs.ai }}'
          DEPLOY_CFG='${{ needs.changes.outputs.deploy_config }}'
          OWNER='${{ needs.meta.outputs.owner }}'
          VER='${{ needs.meta.outputs.version }}'
          # If only deploy config changed, refresh both app services to current channel tags.
          if [[ "$BACKEND_CHANGED" != 'true' && "$AI_CHANGED" != 'true' && "$DEPLOY_CFG" == 'true' ]]; then
            BACKEND_CHANGED=true
            AI_CHANGED=true
            VER='staging'
          fi
          {
            echo "deploy_backend=$([[ "$BACKEND_CHANGED" == 'true' ]] && echo 1 || echo 0)"
            echo "deploy_ai=$([[ "$AI_CHANGED" == 'true' ]] && echo 1 || echo 0)"
            echo "backend_image=ghcr.io/${OWNER}/quilore-backend:${VER}"
            echo "ai_image=ghcr.io/${OWNER}/quilore-ai-service:${VER}"
          } >> "$GITHUB_OUTPUT"

      - name: Sync checkout + login GHCR + deploy on Pi
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_REF: ${{ needs.meta.outputs.full_sha || github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Pass token via env to remote; never embed in git remote URL.
          # Pipe ensure-deploy-path.sh first so a dead SSD prints mount/dmesg instead of a bare mkdir EIO.
          {
            cat deploy/scripts/ensure-deploy-path.sh
            cat <<'EOF'
          cd "${DEPLOY_PATH}"
          if [ ! -d .git ]; then
            git clone "https://github.com/${REPO}.git" .
          fi
          git remote set-url origin "https://github.com/${REPO}.git"
          # Same auth shape as actions/checkout: Basic x-access-token (Bearer fails non-interactively).
          AUTH_HDR="$(printf 'x-access-token:%s' "${GHCR_TOKEN}" | base64 -w0 2>/dev/null || printf 'x-access-token:%s' "${GHCR_TOKEN}" | base64 | tr -d '\n')"
          git -c "http.extraHeader=AUTHORIZATION: basic ${AUTH_HDR}" fetch --prune origin
          git checkout -B dev origin/dev
          git reset --hard "${GIT_REF}"

          if [ ! -f .env ]; then
            echo "error: ${DEPLOY_PATH}/.env missing on Pi — seed once from .env.example" >&2
            exit 1
          fi

          echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin
          bash deploy/scripts/deploy-pi.sh
          EOF
          } | ssh quilore-pi \
            "DEPLOY_PATH='${DEPLOY_PATH}' GHCR_USER='${GHCR_USER}' GHCR_TOKEN='${GHCR_TOKEN}' GIT_REF='${GIT_REF}' REPO='${REPO}' BACKEND_IMAGE='${{ steps.pins.outputs.backend_image }}' AI_SERVICE_IMAGE='${{ steps.pins.outputs.ai_image }}' DEPLOY_BACKEND='${{ steps.pins.outputs.deploy_backend }}' DEPLOY_AI='${{ steps.pins.outputs.deploy_ai }}' bash -s"

      - name: Skip note for client-only
        if: needs.changes.outputs.client == 'true' && needs.changes.outputs.any_server != 'true'
        run: echo "Client-only change — no Pi server deploy (mobile pipeline comes next)."
