name: Publish — Versioned Container Images

# Publishes versioned images to GHCR after CI-green merges to `dev` (staging channel)
# and on explicit version tags (release candidates for production promotion).

on:
  push:
    branches: [dev]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (branch, tag, or SHA)'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Build & Publish Images
    runs-on: ubuntu-latest
    # Re-run service tests before publishing so artifacts are never cut from a red build.
    steps:
      - name: Resolve checkout ref
        id: ref
        run: |
          if [ -n "${{ inputs.ref }}" ]; then
            echo "value=${{ inputs.ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.ref }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.value }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Backend test gate
        working-directory: backend
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: AI service test gate
        working-directory: ai-service
        run: |
          pip install -r requirements.txt
          pip install pytest httpx
          pytest tests/ -v

      - name: Derive image metadata
        id: meta
        run: |
          set -euo pipefail
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          SHA_SHORT="$(git rev-parse --short HEAD)"
          FULL_SHA="$(git rev-parse HEAD)"
          CHANNEL="staging"
          VERSION="staging-${SHA_SHORT}"

          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            CHANNEL="release"
            VERSION="${GITHUB_REF_NAME}"
          fi

          {
            echo "owner=${OWNER}"
            echo "sha_short=${SHA_SHORT}"
            echo "full_sha=${FULL_SHA}"
            echo "channel=${CHANNEL}"
            echo "version=${VERSION}"
            echo "backend_image=${{ env.REGISTRY }}/${OWNER}/quilore-backend"
            echo "ai_image=${{ env.REGISTRY }}/${OWNER}/quilore-ai-service"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Publish backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.backend_image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.backend_image }}:sha-${{ steps.meta.outputs.sha_short }}
            ${{ steps.meta.outputs.backend_image }}:${{ steps.meta.outputs.channel }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.full_sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Publish ai-service image
        uses: docker/build-push-action@v6
        with:
          context: ./ai-service
          file: ./ai-service/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.ai_image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.ai_image }}:sha-${{ steps.meta.outputs.sha_short }}
            ${{ steps.meta.outputs.ai_image }}:${{ steps.meta.outputs.channel }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.full_sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=ai-service
          cache-to: type=gha,mode=max,scope=ai-service

      - name: Write deployment pin artifact
        run: |
          mkdir -p dist
          cat > dist/versions.env <<EOF
          # Generated by publish-images.yml — do not edit by hand in CI.
          QUILORE_IMAGE_CHANNEL=${{ steps.meta.outputs.channel }}
          QUILORE_IMAGE_VERSION=${{ steps.meta.outputs.version }}
          QUILORE_GIT_SHA=${{ steps.meta.outputs.full_sha }}
          BACKEND_IMAGE=${{ steps.meta.outputs.backend_image }}:${{ steps.meta.outputs.version }}
          AI_SERVICE_IMAGE=${{ steps.meta.outputs.ai_image }}:${{ steps.meta.outputs.version }}
          EOF
          cat dist/versions.env

      - name: Upload versions pin
        uses: actions/upload-artifact@v4
        with:
          name: quilore-versions-${{ steps.meta.outputs.version }}
          path: dist/versions.env
          retention-days: 90
