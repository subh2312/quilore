name: Rollback — Restore Previous Production Images

# Rolls production channel tags back to a previously promoted version.
# Prefer rolling back to a known-good `prod-<version>` tag rather than rebuilding.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Previously promoted version to restore (e.g. staging-a1b2c3d or v1.2.3)'
        required: true
        type: string
      confirm:
        description: 'Type rollback-production to confirm'
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: promote-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  rollback:
    name: Rollback Production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Confirm rollback intent
        run: |
          if [ "${{ inputs.confirm }}" != "rollback-production" ]; then
            echo "Refusing rollback: confirmation string mismatch."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Derive image names
        id: meta
        run: |
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          {
            echo "backend=${{ env.REGISTRY }}/${OWNER}/quilore-backend"
            echo "ai=${{ env.REGISTRY }}/${OWNER}/quilore-ai-service"
            echo "version=${{ inputs.version }}"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install crane
        uses: imjasonh/setup-crane@v0.4

      - name: Dry-run validation via local script
        run: |
          bash deploy/scripts/rollback.sh \
            --backend-image "${{ steps.meta.outputs.backend }}" \
            --ai-image "${{ steps.meta.outputs.ai }}" \
            --version "${{ steps.meta.outputs.version }}" \
            --dry-run

      - name: Retag production channel to previous version
        run: |
          bash deploy/scripts/rollback.sh \
            --backend-image "${{ steps.meta.outputs.backend }}" \
            --ai-image "${{ steps.meta.outputs.ai }}" \
            --version "${{ steps.meta.outputs.version }}" \
            --apply

      - name: Optional remote deploy (when DEPLOY_HOST is configured)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          if [ -z "${DEPLOY_HOST:-}" ]; then
            echo "DEPLOY_HOST not set — registry rollback complete; remote apply skipped."
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh -o StrictHostKeyChecking=accept-new \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cd '${DEPLOY_PATH}' && \
             BACKEND_IMAGE='${{ steps.meta.outputs.backend }}:prod-${{ steps.meta.outputs.version }}' \
             AI_SERVICE_IMAGE='${{ steps.meta.outputs.ai }}:prod-${{ steps.meta.outputs.version }}' \
             bash deploy/scripts/apply-env.sh production"
