name: CI — Lint, Test & Image Build

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Spring Boot Backend ─────────────────────────────────
  backend:
    name: Backend (Java 21 / Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build & Test
        run: ./gradlew build --no-daemon

  # ─── FastAPI AI Service ──────────────────────────────────
  ai-service:
    name: AI Service (Python 3.12 / FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest ruff httpx

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest tests/ -v

  # ─── React Native Client ────────────────────────────────
  client:
    name: Client (React Native / Expo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npx eslint . --max-warnings 0

      - name: Type check
        run: npx tsc --noEmit

      - name: Journey / E2E contract tests
        run: npm test

  # ─── Deploy tooling (promotion / rollback scripts) ───────
  deploy-tooling:
    name: Deploy Tooling Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate promotion / rollback scripts
        run: bash deploy/tests/test_promote_rollback.sh

      - name: Validate secret rotation scripts
        run: bash deploy/tests/test_secret_rotation.sh

  # ─── Docker image build (no publish on PRs) ──────────────
  docker-build:
    name: Docker Image Build
    runs-on: ubuntu-latest
    needs: [backend, ai-service]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: quilore-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build ai-service image
        uses: docker/build-push-action@v6
        with:
          context: ./ai-service
          file: ./ai-service/Dockerfile
          push: false
          tags: quilore-ai-service:ci
          cache-from: type=gha,scope=ai-service
          cache-to: type=gha,mode=max,scope=ai-service

  # ─── Docker Compose validation ──────────────────────────
  docker-compose:
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate base compose
        run: docker compose -f docker-compose.yml config --quiet

      - name: Validate staging overlay
        run: >
          docker compose
          -f docker-compose.yml
          -f deploy/overlays/docker-compose.staging.yml
          config --quiet

      - name: Validate production overlay
        run: >
          docker compose
          -f docker-compose.yml
          -f deploy/overlays/docker-compose.prod.yml
          config --quiet

      - name: Validate TLS overlay
        run: >
          docker compose
          -f docker-compose.yml
          -f deploy/overlays/docker-compose.tls.yml
          config --quiet
