name: Request UAT Release Manifest

# Manually triggered once a dev integration candidate is ready. Asks the
# Antigravity orchestrator to assemble a release manifest, which you then
# paste into a Perplexity conversation for a GO / CONDITIONAL_GO / NO_GO
# UAT readiness decision. See AGENTS.md and the orchestrator README.

on:
  workflow_dispatch:
    inputs:
      stories:
        description: "Comma-separated Plane story IDs included in this release"
        required: true
      pr_urls:
        description: "Comma-separated merged PR URLs included in this release"
        required: true
      known_risks:
        description: "Comma-separated known risks (leave blank if none)"
        required: false
        default: ""

jobs:
  build-manifest:
    name: Build Release Manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and fetch release manifest
        env:
          ORCHESTRATOR_URL: ${{ secrets.AI_ORCHESTRATOR_URL }}
          ORCHESTRATOR_TOKEN: ${{ secrets.AI_ORCHESTRATOR_TOKEN }}
        run: |
          STORIES_JSON=$(printf '%s' "${{ github.event.inputs.stories }}" | python3 -c "import sys,json;print(json.dumps([s.strip() for s in sys.stdin.read().split(',') if s.strip()]))")
          PR_URLS_JSON=$(printf '%s' "${{ github.event.inputs.pr_urls }}" | python3 -c "import sys,json;print(json.dumps([s.strip() for s in sys.stdin.read().split(',') if s.strip()]))")
          RISKS_JSON=$(printf '%s' "${{ github.event.inputs.known_risks }}" | python3 -c "import sys,json;print(json.dumps([s.strip() for s in sys.stdin.read().split(',') if s.strip()]))")

          curl -sf -X POST "$ORCHESTRATOR_URL/v1/release/uat-review" \
            -H "Authorization: Bearer $ORCHESTRATOR_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"release_candidate\": \"dev@${{ github.sha }}\", \"stories\": $STORIES_JSON, \"pr_urls\": $PR_URLS_JSON, \"known_risks\": $RISKS_JSON}" \
            | tee release-manifest.json

      - name: Upload manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: release-manifest.json
