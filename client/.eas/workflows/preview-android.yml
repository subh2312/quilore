# Gym UAT Android APK (EAS preview profile).
# Triggers:
#   1) Label a PR with `eas-build-android:preview` (also works via Expo GitHub App labels)
#   2) Manual: `cd client && eas workflow:run .eas/workflows/preview-android.yml`
#
# Requires Expo project GitHub connection with Base directory = `client`.

name: Preview Android APK

on:
  pull_request_labeled:
    labels:
      - eas-build-android:preview

jobs:
  build_android_preview:
    name: Build Android preview APK
    type: build
    params:
      platform: android
      profile: preview
