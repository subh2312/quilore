# Manual / CLI preview APK build (same profile as GitHub label builds).
#
# GitHub PR labels use the Expo GitHub App (no workflow required):
#   eas-build-android:preview
#
# Run this workflow from CLI:
#   cd client && eas workflow:run .eas/workflows/preview-android.yml
#
# Auto on merge: see preview-android-on-dev.yml

name: Preview Android APK

jobs:
  build_android_preview:
    name: Build Android preview APK
    type: build
    params:
      platform: android
      profile: preview
